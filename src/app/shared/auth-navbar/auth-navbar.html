<nav class="auth-navbar">
    <div class="navbar-brand">
        <a routerLink="/" class="brand-link">
            <span class="brand-icon">JM</span>
            <span class="brand-text">Job Matcher</span>
        </a>
    </div>

    <ul class="navbar-nav">
        <li class="nav-item">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
                <app-icon name="home"></app-icon>
                <span>Home</span>
            </a>
        </li>

        <!-- Notifications -->
        <li class="nav-item notification-item">
            <a routerLink="/notifications" class="nav-link icon-link">
                <app-icon name="notification"></app-icon>
                @if (notificationCount > 0) {
                <span class="notification-badge">{{ notificationCount }}</span>
                }
            </a>
        </li>

        <!-- Profile Dropdown -->
        <li class="nav-item profile-item">
            <div class="profile-trigger" (click)="toggleMenu()">
                <img [src]="user?.avatar || 'assets/default-avatar.png'" alt="Profile" class="profile-avatar" />
            </div>
            @if (isMenuVisible) {
            <div class="dropdown-menu">
                <div class="dropdown-header">
                    <img [src]="user?.avatar || 'assets/default-avatar.png'" alt="Profile" class="dropdown-avatar" />
                    <div class="dropdown-user-info">
                        <strong>{{ user?.name || 'User' }}</strong>
                        <span>{{ user?.email || '' }}</span>
                    </div>
                </div>
                <div class="dropdown-divider"></div>
                <a routerLink="/profile" (click)="toggleMenu()" class="dropdown-item">
                    <app-icon name="user"></app-icon>
                    Profile
                </a>
                <div class="dropdown-divider"></div>
                <button (click)="logout()" class="dropdown-item logout-btn">
                    <app-icon name="logout"></app-icon>
                    Logout
                </button>
            </div>
            }
        </li>
    </ul>
</nav>
