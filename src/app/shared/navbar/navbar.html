<nav class="navbar">
    <div class="navbar-brand">
        <a routerLink="/" class="brand-link">Job Matcher</a>
    </div>
    <ul class="navbar-nav">
        <li class="nav-item">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
                class="nav-link">Home</a>
        </li>
        @if (isLoggedIn && currentUser?.role === 'recruiter') {
        <li class="nav-item">
            <a routerLink="/recruiter/jobs" routerLinkActive="active" class="nav-link">My Jobs</a>
        </li>
        }

        <!-- Not logged in: Show Login -->
        @if (!isLoggedIn) {
        <li class="nav-item">
            <a routerLink="/login" routerLinkActive="active" class="nav-link">Login</a>
        </li>
        }

        <!-- Logged in: Show Notifications and Profile -->
        @if (isLoggedIn) {
        @if (currentUser?.role === 'candidate') {
        <li class="nav-item">
            <div class="notif-wrap">
                <button class="notif-button" (click)="toggleNotif()" [class.notif-button--unread]="unreadCount() > 0">
                    <app-icon name="notification" [size]="22"
                        [color]="unreadCount() > 0 ? '#2563eb' : '#6b7280'"></app-icon>
                    @if (unreadCount() > 0) {
                    <span class="notif-badge">{{ unreadCount() }}</span>
                    }
                </button>
                @if (isNotificationsVisible) {
                <div class="notif-dropdown">
                    <app-notification></app-notification>
                </div>
                }
            </div>
        </li>
        }
        <li class="nav-item">
            <img [src]="getProfileImageUrl()" (click)="toggleMenu()" alt="profile" class="profile-image" />
            @if (isMenuVisible) {
            <app-profile></app-profile>
            }
        </li>
        }
    </ul>
</nav>
