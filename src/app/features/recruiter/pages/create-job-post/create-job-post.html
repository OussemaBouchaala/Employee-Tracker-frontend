<div class="container">
    <a routerLink="/recruiter/jobs" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Back to Jobs
    </a>

    @if (pageLoading()) {
    <div class="loading-container">
        <div class="spinner-large"></div>
        <p>Loading job post...</p>
    </div>
    } @else {
    <div class="card">
        <div class="card-header">
            <h1>{{ isEditMode() ? 'Edit Job Post' : 'Create New Job Post' }}</h1>
            @if (isEditMode()) {
            <span class="edit-badge">Editing</span>
            }
        </div>

        <form (ngSubmit)="onSubmit()" #jobForm="ngForm">

            <div class="form-group">
                <label for="title">Job Title</label>
                <input type="text" id="title" name="title" [(ngModel)]="jobPost().title" required
                    placeholder="e.g. Senior Software Engineer">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="employmentType">Employment Type</label>
                    <select id="employmentType" name="employmentType" [(ngModel)]="jobPost().employmentType" required>
                        <option *ngFor="let type of employmentTypes" [value]="type">{{ type }}</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="seniorityLevel">Seniority Level</label>
                    <select id="seniorityLevel" name="seniorityLevel" [(ngModel)]="jobPost().seniorityLevel" required>
                        <option *ngFor="let level of seniorityLevels" [value]="level">{{ level }}</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="industries">Industry</label>
                <input type="text" id="industries" name="industries" [(ngModel)]="jobPost().industries" required
                    placeholder="e.g. Technology, Fintech">
            </div>

            <div class="form-group">
                <label for="jobFunction">Job Function</label>
                <input type="text" id="jobFunction" name="jobFunction" [(ngModel)]="jobPost().jobFunction" required
                    placeholder="e.g. Engineering, Design">
            </div>

            <div class="form-group">
                <label for="requirements">Description & Requirements</label>
                <textarea id="requirements" name="requirements" [(ngModel)]="jobPost().requirements" required
                    placeholder="Describe the role and requirements..."></textarea>
            </div>

            <div class="form-actions">
                <a routerLink="/recruiter/jobs" class="btn btn-cancel">Cancel</a>
                <button type="submit" [disabled]="!jobForm.form.valid || loading()" class="btn btn-submit">
                    @if (loading()) {
                    <span class="spinner"></span>
                    }
                    {{ loading() ? (isEditMode() ? 'Updating...' : 'Creating...') : (isEditMode() ? 'Update Job Post' :
                    'Create Job Post') }}
                </button>
            </div>

        </form>
    </div>
    }

    <!-- Toast Notification -->
    @if (showToast()) {
    <div class="toast" [class]="'toast-' + toastType()">
        @if (toastType() === 'success') {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        } @else {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        }
        <span>{{ toastMessage() }}</span>
    </div>
    }
</div>
