<div class="container mx-auto px-4 py-8 max-w-2xl">
    <div class="mb-6">
        <a routerLink="/recruiter/jobs" class="text-blue-600 hover:text-blue-800 font-semibold flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to Jobs
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Create New Job Post</h1>

        <form (ngSubmit)="onSubmit()" #jobForm="ngForm" class="space-y-6">

            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Job Title</label>
                <input type="text" id="title" name="title" [(ngModel)]="jobPost.title" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    placeholder="e.g. Senior Software Engineer">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="employmentType" class="block text-sm font-medium text-gray-700 mb-1">Employment
                        Type</label>
                    <select id="employmentType" name="employmentType" [(ngModel)]="jobPost.employmentType" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white">
                        <option *ngFor="let type of employmentTypes" [value]="type">{{ type }}</option>
                    </select>
                </div>

                <div>
                    <label for="seniorityLevel" class="block text-sm font-medium text-gray-700 mb-1">Seniority
                        Level</label>
                    <select id="seniorityLevel" name="seniorityLevel" [(ngModel)]="jobPost.seniorityLevel" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white">
                        <option *ngFor="let level of seniorityLevels" [value]="level">{{ level }}</option>
                    </select>
                </div>
            </div>

            <div>
                <label for="industries" class="block text-sm font-medium text-gray-700 mb-1">Industry</label>
                <input type="text" id="industries" name="industries" [(ngModel)]="jobPost.industries" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    placeholder="e.g. Technology, Fintech">
            </div>

            <div>
                <label for="jobFunction" class="block text-sm font-medium text-gray-700 mb-1">Job Function</label>
                <input type="text" id="jobFunction" name="jobFunction" [(ngModel)]="jobPost.jobFunction" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    placeholder="e.g. Engineering, Design">
            </div>

            <div>
                <label for="requirements" class="block text-sm font-medium text-gray-700 mb-1">Description &
                    Requirements</label>
                <textarea id="requirements" name="requirements" [(ngModel)]="jobPost.requirements" required rows="6"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    placeholder="Describe the role and requirements..."></textarea>
            </div>

            <div class="flex justify-end pt-4">
                <button type="button" routerLink="/recruiter/jobs"
                    class="mr-4 px-6 py-2 text-gray-600 hover:text-gray-800 font-medium transition">
                    Cancel
                </button>
                <button type="submit" [disabled]="!jobForm.form.valid || loading"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed flex items-center">
                    <span *ngIf="loading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white">
                        <svg class="opacity-25" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <circle class="opacity-75" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                    </span>
                    {{ loading ? 'Creating...' : 'Create Job Post' }}
                </button>
            </div>

        </form>
    </div>
</div>
