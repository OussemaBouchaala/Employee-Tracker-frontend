@if(isOpen) {
<div class="modal-overlay">
    <div class="modal-content">
        <h3>Edit User</h3>
        <form (ngSubmit)="save()">
            <div class="form-group">
                <label for="name">Name</label>
                <input id="name" [(ngModel)]="editData.name" name="name" required>
            </div>

            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input id="phoneNumber" [(ngModel)]="editData.phoneNumber" name="phoneNumber">
            </div>

            @if(user?.role === 'recruiter') {
            <div class="form-group">
                <label for="companyName">Company Name</label>
                <input id="companyName" [(ngModel)]="editData.companyName" name="companyName">
            </div>
            }
            @if(user?.role === 'candidate') {
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" [(ngModel)]="editData.description" name="description"></textarea>
            </div>
            }
            <div class="actions">
                <button type="button" (click)="close()" class="btn-secondary">Cancel</button>
                <button type="submit" class="btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
}
