<div class="modal-overlay" *ngIf="isOpen">
    <div class="modal-content">
        <h3>Edit User</h3>
        <form (ngSubmit)="save()">
            <div class="form-group">
                <label>Name</label>
                <input [(ngModel)]="editData.name" name="name" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input [(ngModel)]="editData.phoneNumber" name="phoneNumber" type="number">
            </div>

            <div class="form-group" *ngIf="user?.role === 'recruiter'">
                <label>Company Name</label>
                <input [(ngModel)]="editData.companyName" name="companyName">
            </div>

            <div class="form-group" *ngIf="user?.role === 'candidate'">
                <label>Description</label>
                <textarea [(ngModel)]="editData.description" name="description"></textarea>
            </div>

            <div class="actions">
                <button type="button" (click)="close()" class="btn-secondary">Cancel</button>
                <button type="submit" class="btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
