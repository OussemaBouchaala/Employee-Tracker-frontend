<div class="login-container">
  <form class="login-form" (ngSubmit)="onSubmit()">
    <h2>Login</h2>
    @if (errorMessage) {
      <div class="error-message">{{ errorMessage }}</div>
    }
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" [(ngModel)]="email" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" [(ngModel)]="password" required>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-login" [disabled]="loading">{{ loading ? 'Signing in...' : 'Sign In' }}</button>
    </div>
    <div class="form-footer">
      <a href="#">Forgot password?</a>
      <p>Don't have an account? <a routerLink="/register">Register here</a></p>
    </div>
  </form>
</div>
