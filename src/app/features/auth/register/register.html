<div class="register-container">
    <form class="register-form" (ngSubmit)="onSubmit()">
        <h2>Create Account</h2>

        <!-- Role Selection -->
        <div class="role-selector">
            <label class="role-option" [class.active]="selectedRole === 'CANDIDATE'">
                <input type="radio" name="role" value="CANDIDATE" [(ngModel)]="selectedRole">
                <span class="role-icon">👤</span>
                <span class="role-label">Candidate</span>
            </label>
            <label class="role-option" [class.active]="selectedRole === 'RECRUITER'">
                <input type="radio" name="role" value="RECRUITER" [(ngModel)]="selectedRole">
                <span class="role-icon">🏢</span>
                <span class="role-label">Recruiter</span>
            </label>
        </div>

        <!-- Common Fields -->
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" [(ngModel)]="formData.name"
                required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" [(ngModel)]="formData.email"
                required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Min 8 characters"
                [(ngModel)]="formData.password" required minlength="8">
        </div>

        <div class="form-group">
            <label for="phoneNumber">Phone Number <span class="optional">(Optional)</span></label>
            <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Enter your phone number"
                [(ngModel)]="formData.phoneNumber">
        </div>

        <div class="form-group">
            <label for="profilePicture">Profile Picture <span class="optional">(Optional)</span></label>
            <div class="file-upload">
                <input type="file" id="profilePicture" name="profilePicture" (change)="onProfilePictureSelected($event)"
                    accept="image/*">
                <label for="profilePicture" class="file-label">
                    <span class="file-icon">🖼️</span>
                    <span class="file-text">{{ profilePictureName || 'Choose your profile picture' }}</span>
                </label>
            </div>
        </div>

        <!-- Recruiter-specific Fields -->
        @if (selectedRole === 'RECRUITER') {
        <div class="role-specific-fields">
            <div class="section-divider">
                <span>Company Information</span>
            </div>
            <div class="form-group">
                <label for="companyName">Company Name</label>
                <input type="text" id="companyName" name="companyName" placeholder="Enter your company name"
                    [(ngModel)]="formData.companyName" required>
            </div>
        </div>
        }

        <!-- Candidate-specific Fields -->
        @if (selectedRole === 'CANDIDATE') {
        <div class="role-specific-fields">
            <div class="section-divider">
                <span>Professional Information</span>
            </div>
            <div class="form-group">
                <label for="description">About You</label>
                <textarea id="description" name="description" placeholder="Tell us about yourself and your experience"
                    [(ngModel)]="formData.description" rows="4" required></textarea>
            </div>
            <div class="form-group">
                <label for="cv">CV / Resume</label>
                <div class="file-upload">
                    <input type="file" id="cv" name="cv" (change)="onFileSelected($event)" accept=".pdf,.doc,.docx"
                        required>
                    <label for="cv" class="file-label">
                        <span class="file-icon">📄</span>
                        <span class="file-text">{{ fileName || 'Choose your CV file' }}</span>
                    </label>
                </div>
            </div>
        </div>
        }

        <div class="form-actions">
            <button type="submit" class="btn-register">Create Account</button>
        </div>

        <div class="form-footer">
            <p>Already have an account? <a routerLink="/login">Sign in here</a></p>
        </div>
    </form>
</div>
